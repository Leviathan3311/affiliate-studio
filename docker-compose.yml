# Local / single-VPS stack (system design §4.2, "Phương án B"): Postgres+pgvector, API, worker, web.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: growthpilot
      POSTGRES_PASSWORD: growthpilot
      POSTGRES_DB: growthpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthpilot"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://growthpilot:growthpilot@db:5432/growthpilot
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://growthpilot:growthpilot@db:5432/growthpilot
    command: ["python", "-m", "app.worker"]
    depends_on: [api]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
