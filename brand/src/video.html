<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
.wrap{padding:0 18px;display:flex;flex-direction:column;gap:16px}
.ask{background:var(--surface);border-radius:20px;padding:16px 18px;font-size:18px;line-height:1.4;color:var(--muted)}
.ask b{color:var(--text);display:block;font-size:14px;margin-bottom:6px;color:var(--faint);font-weight:600}
.card{background:var(--surface);border-radius:24px;overflow:hidden}
.thumb{height:360px;background:url(thumb.jpg) center/cover;position:relative}
.play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:rgba(14,13,12,.7);display:grid;place-items:center}
.play:after{content:"";border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:8px}
.meta{padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
.meta b{font-size:20px}
.btn{background:var(--text);color:var(--ground);border-radius:999px;text-align:center;font-weight:800;font-size:19px;padding:16px}
</style>
<body><div class="screen">
<div class="status"><span>9:41</span><span class="dots"><i></i><i></i></span></div>
<div class="bar"><img class="mark" src="mark.svg" width="38" height="38"><h1>Video quảng cáo</h1></div>
<div class="wrap">
  <div class="ask"><b>Bạn mô tả</b>“Quảng cáo shop quần áo, khách đặt qua Fanpage”</div>
  <div class="card"><div class="thumb"><div class="play"></div></div>
    <div class="meta"><b>Video 30 giây</b><span class="pill ok">✓ Xong</span></div></div>
  <div class="btn">Đăng lên Facebook & Instagram</div>
</div>
<div class="nav"><span></span><span class="on"></span><span></span><span></span></div>
</div></body>
